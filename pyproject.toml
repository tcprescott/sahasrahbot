[tool.aerich]
tortoise_orm = "migrations.tortoise_config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.poetry]
name = "sahasrahbot"
version = "0.1.0"
description = ""
authors = ["Thomas Prescott <tcprescott@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
quart = ">=0.22"
Quart-Discord = ">=2.1.4"
aerich = ">=0.10"
aioboto3 = ">=15.5"
aiocache = ">=0.12.3"
aiofiles = ">=25.1"
aiohttp = ">=3.14"
aiomysql = ">=0.3.2"
beautifulsoup4 = ">=4.15"
gspread = ">=6.2"
gspread-asyncio = ">=3.0"
PyYAML = ">=6.0.4"
html2markdown = ">=0.1.7"
oauth2client = ">=4.1.3"
oauthlib = ">=3.2.2"
google-api-python-client = ">=2.202"
html5lib = ">=1.1"
python-dateutil = ">=2.9"
python-slugify = ">=9.0"
pytz = ">=2025.2"
pydantic = ">=2.12"
pyz3r = "^6.1.0"
isodate = ">=0.7.2"
"discord.py" = ">=2.7"
jishaku = ">=2.8"
pyrankvote = ">=2.0.6"
racetime-bot = {url = "https://github.com/tcprescott/racetime-bot/archive/48afdd4691f0f329eebb5dd33b1cbcf42921e980.zip"}
markdown = ">=3.11"
sentry-sdk = ">=3.0"
tenacity = ">=9.2"
tortoise-orm = ">=1.1.9"
werkzeug = ">=3.1.9"
quart-schema = {version = "^0.25", extras = ["pydantic"]}
mcp = ">=2.3,<3"


[tool.poetry.group.dev.dependencies]
pycodestyle = "*"
pylint = "*"
autopep8 = "*"
ipython = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Local database for the standalone web app (devserver/). Start it with
# ./scripts/dev.sh, which runs `docker compose -f docker-compose.dev.yml up -d --wait`.
# Never point this at production data: devserver drops and reseeds it on --reset.
services:
  db:
    image: mariadb:11
    # Throwaway local database: root with no password, reachable only from this
    # machine (the port is bound to 127.0.0.1).
    environment:
      MARIADB_DATABASE: sahasrahbot_dev
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - devdb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  devdb:

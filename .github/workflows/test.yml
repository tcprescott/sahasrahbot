name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so a tool release can't break every job at once. Bump deliberately.
  POETRY_VERSION: '2.4.3'
  RUFF_VERSION: '0.16.9'
  PYTHON_VERSION: '3.13'

jobs:
  lint:
    # Small, bug-only rule set (see ruff.toml). Needs no project install.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Ruff
        run: pipx run ruff==${{ env.RUFF_VERSION }} check --output-format=github .

  guardrails:
    # The checks in .claude/scripts/ encode rules from CLAUDE.md (no privileged
    # intents, every config key in config.example.py, valid syntax). As Claude
    # Code hooks they only fire inside a Claude session; here they bind every
    # commit, whoever wrote it. Stdlib only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Guardrails
        run: python scripts/guardrails.py --all

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: |
          poetry env use python${{ env.PYTHON_VERSION }}
          # Four locked packages ship only as source (html2markdown,
          # python-bps-continued, quart-discord, racetime-bot), so this install
          # has to run their build scripts. Everything else is a wheel.
          poetry install --no-root --no-interaction
          # pytest isn't in the Poetry dev group yet; install it into the venv
          # without changing the dependency files.
          poetry run python -m pip install --only-binary=:all: pytest
      - name: Install test tooling
        # pytest-asyncio and pytest-cov (requirements-test.txt) aren't in the
        # Poetry dev group yet either. Wheels only, so no build scripts run.
        # Calls the venv's pip directly rather than through Poetry.
        run: |
          VENV="$(poetry env info --path)"
          "$VENV/bin/python" -m pip install --only-binary=:all: -r requirements-test.txt
      - name: Pytest
        # No config.py in CI: tests/conftest.py loads config.example.py.
        run: poetry run python -m pytest -q tests --cov --cov-report=term:skip-covered

  web:
    # The React app in web/. Its API types are generated from the backend's
    # routes (scripts/export_openapi.py), so a route or schema change that
    # breaks a screen fails here. Needs the Python app installed for that step.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
      - name: Install Python dependencies
        run: |
          poetry env use python${{ env.PYTHON_VERSION }}
          poetry install --no-root --no-interaction
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Generate the API client types
        working-directory: web
        run: npm run gen:api
      - name: Typecheck, unit tests, build
        working-directory: web
        run: |
          npm run typecheck
          npm test
          npm run build

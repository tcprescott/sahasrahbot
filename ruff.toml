# Ruff lint gate. Kept in its own file (not pyproject.toml) so it can change
# without touching dependency files.
#
# The rule set starts deliberately small: only checks that catch real bugs
# (syntax errors, undefined names, broken comparisons). Widen it a family at a
# time, fixing or baselining what each one finds, rather than turning on
# everything and drowning in style noise.

target-version = "py311"
line-length = 120
extend-exclude = [
    "utils/",        # vendored submodules (door randomizer, enemizer)
    "migrations/",   # generated by aerich
]

[lint]
select = [
    "E9",    # syntax / IO errors
    "F63",   # invalid comparisons (e.g. `is` with a literal)
    "F7",    # misplaced statements (return outside function, etc.)
    "F82",   # undefined names
]

[lint.per-file-ignores]
# Known pre-existing bug: the BingoSync client references a cookie `jar` that is
# never defined. Fix it, then delete this entry.
"alttprbot/alttprgen/randomizer/bingosync.py" = ["F821"]

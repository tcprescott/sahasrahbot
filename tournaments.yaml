# Tournament and daily race settings, one entry per event slug.
#
# The key is the event slug that alttprbot/tournaments.py maps to a race class
# (TOURNAMENT_DATA). alttprbot/tournament/settings.py turns an entry into the
# TournamentConfig the race engine uses, resolving the Discord ids below with
# the live bot. These are Discord ids, not secrets: change them here, in a
# reviewed PR, when an event moves server or a season gets new channels/roles.
#
# Fields (all but guild, racetime_category and racetime_goal are optional):
#   guild               Discord server id
#   racetime_category   racetime.gg category slug
#   racetime_goal       racetime.gg goal name
#   channels            audit, commentary, mod, scheduling_needs: channel ids
#   roles               admin, helper, commentator, mod: lists of role ids
#   any other TournamentConfig field (stream_delay, room_open_time,
#   create_scheduled_events, scheduling_needs_tracker, gsheet_id, ...)
#   announcement        dailies only: what alttprbot_discord/notifications.py
#                       posts when the room opens (channel, heading, mention
#                       role, webhook_mention role, show_seed_time)

